# Builds the FIRM iPhone app on a GitHub Mac and sends it to TestFlight (App Store Connect), so no Mac is needed.
# Run it by hand: Actions > iPhone app > Run workflow.
#
# Secrets (Settings > Secrets and variables > Actions):
#   GOOGLE_SERVICE_INFO_PLIST   the GoogleService-Info.plist file from Firebase (push)
#   APPLE_TEAM_ID               10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect > Users and Access > Integrations > App Store Connect API
#   ASC_KEY_P8                  the contents of that key's AuthKey_XXXX.p8 file (Admin role)
name: iPhone app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Secrets
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$PLIST" > ios/App/App/GoogleService-Info.plist
          # Pasted keys can pick up Windows line endings or lose the last newline; Apple's parser rejects both.
          printf '%s\n' "$P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/AuthKey.p8"
          # Shape check only (never prints the key): it must be one BEGIN line, base64 lines, one END line.
          f="$RUNNER_TEMP/AuthKey.p8"
          # If only the middle (base64) lines were pasted, put the header and footer back.
          if ! grep -q 'BEGIN PRIVATE KEY' "$f" && grep -Eqv '[^A-Za-z0-9+/=]' "$f"; then
            { echo '-----BEGIN PRIVATE KEY-----'; cat "$f"; echo '-----END PRIVATE KEY-----'; } > "$f.tmp" && mv "$f.tmp" "$f"
          fi
          echo "Key file: $(wc -c < "$f") bytes, $(wc -l < "$f") lines; BEGIN lines: $(grep -c 'BEGIN PRIVATE KEY' "$f" || true); END lines: $(grep -c 'END PRIVATE KEY' "$f" || true)"
          if ! grep -q 'BEGIN PRIVATE KEY' "$f" || ! grep -q 'END PRIVATE KEY' "$f"; then
            echo "::error::The ASC_KEY_P8 secret isn't a whole .p8 key. Open AuthKey_XXXX.p8 in Notepad, copy everything from -----BEGIN to END PRIVATE KEY-----, and paste it into the secret again."
            exit 1
          fi
      - run: npm ci
      - run: npm run sync -- ios
      # Archive with a placeholder (ad-hoc) signature: automatic development signing needs a registered
      # test device, which we don't have. The export step below re-signs it for the App Store using
      # Apple's cloud-managed distribution certificate, keeping the app's entitlements.
      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FIRM.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive
      - name: Upload to TestFlight
        working-directory: mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FIRM.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
