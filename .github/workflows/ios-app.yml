# Builds the FIRM iPhone app on a GitHub Mac and sends it to TestFlight (App Store Connect), so no Mac is needed.
# Run it by hand: Actions > iPhone app > Run workflow.
#
# Secrets (Settings > Secrets and variables > Actions):
#   GOOGLE_SERVICE_INFO_PLIST   the GoogleService-Info.plist file from Firebase (push)
#   APPLE_TEAM_ID               10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect > Users and Access > Integrations > App Store Connect API
#   ASC_KEY_P8                  the contents of that key's AuthKey_XXXX.p8 file (Admin role)
name: iPhone app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Secrets
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$PLIST" > ios/App/App/GoogleService-Info.plist
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
      - run: npm ci
      - run: npm run sync -- ios
      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FIRM.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive
      - name: Upload to TestFlight
        working-directory: mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FIRM.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
