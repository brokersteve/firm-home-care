# Read-only health check of the live Home Care database: how many homes, tenants and reminders the app has.
# Shows counts and street addresses only, never tenant names, emails or phones. Run it by hand from Actions.
name: Check Home Care

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database ID
        run: |
          npx wrangler d1 list --json > d1.json
          id=$(node -e "const d=require('./d1.json').find(x=>x.name==='firm-home-care');process.stdout.write(d?d.uuid:'')")
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" wrangler.toml
      - name: Counts
        run: |
          q() { npx wrangler d1 execute firm-home-care --remote --json --command "$1" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(s)[0].results))}catch{console.log('(could not read: '+s.slice(0,300)+')')}})"; }
          {
            echo "## Home Care data"
            echo "Last Rentec syncs: $(q 'SELECT started_at, finished_at, properties, tenants, substr(error, 1, 300) AS error FROM sync_runs ORDER BY id DESC LIMIT 3')"
            echo "Homes: $(q 'SELECT COUNT(*) AS n FROM properties')"
            echo "Active tenants: $(q 'SELECT COUNT(*) AS n FROM tenants WHERE active = 1')"
            echo "Tenants with an email: $(q "SELECT COUNT(*) AS n FROM tenants WHERE active = 1 AND email IS NOT NULL AND email != ''")"
            echo "Reminders sent: $(q 'SELECT COUNT(*) AS n FROM reminders_sent')"
            echo "Homes and active tenants per home:"
            echo '```'
            q "SELECT p.address, (SELECT COUNT(*) FROM tenants t WHERE t.property_id = p.id AND t.active = 1) AS tenants FROM properties p ORDER BY p.address"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
